[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dlguide"
version = "0.1.0"
description = "Local, transparent deep-learning practice runtime"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.0", "numpy>=1.24"]
vision = ["torch>=2.0", "torchvision>=0.15", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dlguide*"]

[tool.setuptools.package-data]
dlguide = ["metadata/*.json", "checks/*.py"]
